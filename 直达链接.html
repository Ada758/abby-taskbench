<title>Abby 学习工作台 - 跳转中</title>
<style>
body{font-family:-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;background:linear-gradient(135deg,#6B9080,#A4C3B2);}
.card{text-align:center;padding:40px 60px;background:#fff;border-radius:20px;box-shadow:0 8px 30px rgba(0,0,0,0.12);}
h1{color:#6B9080;font-size:24px;margin:0 0 8px;}
p{color:#888;font-size:14px;margin:0;}
.spinner{width:40px;height:40px;border:4px solid #E8732C;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>

<body>
<div class="card">
<div class="spinner"></div>
<h1>正在打开 Abby 学习工作台</h1>
<p>如未自动跳转，请<a href="https://ada758.github.io/abby-taskbench/?v=2&t=20260729" style="color:#E8732C;">点击这里</a></p>
</div>
<script>
// 自动清理旧 Service Worker 缓存
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(function(regs){
    regs.forEach(function(r){ r.unregister(); });
  }).then(function(){
    if(caches){ caches.keys().then(function(keys){ keys.forEach(function(k){ caches.delete(k); }); }); }
  }).finally(function(){
    setTimeout(function(){ window.location.href='https://ada758.github.io/abby-taskbench/?v=2&t=20260729'; },300);
  });
}else{
  setTimeout(function(){ window.location.href='https://ada758.github.io/abby-taskbench/?v=2&t=20260729'; },300);
}
</script>
</body>
