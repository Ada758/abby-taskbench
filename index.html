<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Abby学习工作台">

<title>Abby 学习工作台</title>

<style>
:root{
  --bg:#DCE5D8;--bg-soft:#E8EEE4;--panel:#CFD9C9;--card:#F0F4ED;--card-2:#E0E6DB;
  --ink:#3D4A38;--ink-soft:#7A8570;--line:#C5D0BC;
  --orange:#E8732C;--orange-deep:#C75A14;--orange-soft:#F5C4A0;--orange-bg:#FCE5D4;
  --ok:#6B9080;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);
}
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* Top Bar */
.topbar{
  background:var(--panel);padding:8px 12px;display:flex;align-items:center;gap:8px;
  position:sticky;top:0;z-index:100;min-height:48px;
}
.topbar .hamburger{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:none;background:none;cursor:pointer;color:var(--ink);font-size:22px}
.topbar .title{font-size:16px;font-weight:700;flex:1;color:var(--ink)}
.topbar .date{font-size:12px;color:var(--ink-soft);white-space:nowrap}
.topbar .add-btn{width:32px;height:32px;border-radius:50%;background:var(--orange);color:#fff;border:none;cursor:pointer;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center}

/* Chips */
.chips-wrap{
  background:var(--bg-soft);padding:8px 12px;
  display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.chips-wrap::-webkit-scrollbar{display:none}
.chip{
  display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:20px;
  background:var(--card-2);border:2px solid transparent;cursor:pointer;
  white-space:nowrap;font-size:14px;font-weight:600;color:var(--ink);
  transition:all .2s;
}
.chip.active{background:var(--orange-bg);border-color:var(--orange);color:var(--orange-deep)}
.chip svg{width:22px;height:22px}
.chip-icon-chinese,.chip-icon-math,.chip-icon-english,.chip-icon-game{display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:4px;font-weight:700;font-size:11px;color:#fff}
.chip-icon-chinese{background:#6B9080}
.chip-icon-math{background:#5B7FB0}
.chip-icon-english{background:#B06B8F}
.chip-icon-game{background:var(--orange)}

/* Main Area */
.main{flex:1;overflow-y:auto;padding:12px;background:var(--bg);-webkit-overflow-scrolling:touch}

/* Ancient Quote Card */
.quote-card{
  background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px;
  border:1px solid var(--line);position:relative;overflow:hidden;
}
.quote-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:var(--orange);border-radius:4px 0 0 4px}
.quote-card .q-title{font-size:13px;color:var(--orange-deep);font-weight:700;margin-bottom:6px}
.quote-card .q-text{font-size:15px;font-weight:600;line-height:1.6;margin-bottom:6px}
.quote-card .q-source{font-size:12px;color:var(--ink-soft)}
.quote-card .q-note{font-size:12px;color:var(--ink-soft);margin-top:4px}

/* Goal Card */
.goal-card{
  background:var(--orange-bg);border-radius:12px;padding:12px 14px;margin-bottom:12px;
  border:1px solid var(--orange-soft);font-size:14px;color:var(--orange-deep);
}
.goal-card .goal-label{font-weight:700;font-size:13px;color:var(--orange)}

/* Task List */
.task-item{
  background:var(--card);border-radius:10px;margin-bottom:8px;
  border:1px solid var(--line);overflow:hidden;
  transition:all .2s;
}
.task-item.completed{opacity:.6;background:var(--bg-soft)}
.task-header{
  display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;
}
.task-header .check{
  width:24px;height:24px;border-radius:50%;border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:all .2s;font-size:14px;
}
.task-header .check.checked{background:var(--ok);border-color:var(--ok);color:#fff}
.task-header .task-title{font-size:14px;font-weight:600;flex:1}
.task-header .task-title.done{text-decoration:line-through;color:var(--ink-soft)}
.task-header .expand-icon{font-size:12px;color:var(--ink-soft);transition:transform .2s}
.task-header .expand-icon.open{transform:rotate(180deg)}
.task-detail{padding:0 14px 14px;display:none}
.task-detail.show{display:block}
.task-video{margin-bottom:10px}
.task-video a{
  display:inline-flex;align-items:center;gap:4px;padding:6px 12px;
  background:var(--orange-bg);border-radius:8px;color:var(--orange-deep);
  font-size:13px;font-weight:600;text-decoration:none;
}
.task-video a:hover{background:var(--orange-soft)}
.task-desc{font-size:13px;color:var(--ink-soft);line-height:1.5;margin-bottom:8px}

/* English dual layout */
.english-dual{display:flex;gap:10px;flex-wrap:wrap}
.english-dual .scene-col{flex:0 0 220px;min-width:200px;display:flex;flex-direction:column;gap:8px}
.english-dual .scene-img{background:var(--card-2);border-radius:8px;border:1px solid var(--line);padding:8px;display:flex;align-items:center;justify-content:center;min-height:150px}
.english-dual .scene-img svg{width:100%;height:auto;max-height:150px}
.english-dual .scene-line{background:var(--card-2);border-radius:8px;padding:10px;border:1px solid var(--line);min-height:80px}
.english-dual .scene-role{font-size:11px;font-weight:700;color:var(--orange-deep);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.5px}
.english-dual .scene-en{font-size:14px;font-weight:600;color:var(--ink);min-height:18px;margin-bottom:2px}
.english-dual .scene-zh{font-size:12px;color:var(--ink-soft);min-height:16px}
.english-dual .scene-read{font-size:11px;color:var(--orange-deep);margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);min-height:16px;font-style:italic}
.english-dual .read-col{flex:1;min-width:200px;background:var(--card-2);border-radius:8px;padding:10px}
.english-dual .read-col .read-title{font-size:13px;font-weight:700;color:var(--orange-deep);margin-bottom:8px}
.english-dual .read-col .line-item{
  padding:6px 10px;margin-bottom:4px;border-radius:6px;
  font-size:13px;background:var(--card);border:1px solid var(--line);
  transition:all .15s;
}
.english-dual .read-col .line-item.reading{background:var(--orange-bg);border-color:var(--orange)}
.english-dual .read-col .line-item:hover{background:var(--orange-bg);border-color:var(--orange-soft)}
.english-dual .read-col .line-label{font-weight:700;color:var(--orange-deep);font-size:11px;margin-bottom:2px}
.english-dual .read-col .line-en{font-size:13px;margin-bottom:1px}
.english-dual .read-col .line-zh{font-size:12px;color:var(--ink-soft);margin-bottom:4px}
.english-dual .read-col .line-actions{display:flex;align-items:center;gap:6px}
.english-dual .read-col .play-btn,.english-dual .read-col .mic-btn{
  border:none;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;
  font-size:13px;cursor:pointer;transition:all .15s;
}
.english-dual .read-col .play-btn{background:var(--orange);color:#fff}
.english-dual .read-col .play-btn:hover{background:var(--orange-deep)}
.english-dual .read-col .mic-btn{background:var(--card-2);border:1px solid var(--line);color:var(--ink)}
.english-dual .read-col .mic-btn.recording{background:#e74c3c;color:#fff;border-color:#c0392b;animation:pulse 1s ease-in-out infinite}
.english-dual .read-col .read-result{font-size:11px;font-weight:600;margin-left:4px}
.english-dual .read-col .read-result.ok{color:#27ae60}
.english-dual .read-col .read-result.retry{color:var(--orange-deep)}
.english-dual .read-col .read-result.nosupport{color:#999}
.english-dual .read-col .words{font-size:12px;color:var(--ink-soft);margin-top:8px;padding:6px 10px;background:var(--orange-bg);border-radius:6px}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.15);opacity:0.8}}

/* English quiz */
.en-quiz{margin-top:10px}
.en-quiz .q-item{padding:8px;margin-bottom:6px;background:var(--card);border-radius:8px;border:1px solid var(--line)}
.en-quiz .q-item .q-text{font-size:13px;font-weight:600;margin-bottom:6px}
.en-quiz .q-item .q-opts{display:flex;flex-direction:column;gap:4px}
.en-quiz .q-item .q-opt{
  padding:6px 10px;border-radius:6px;font-size:13px;cursor:pointer;
  background:var(--bg-soft);border:1px solid var(--line);transition:all .15s;
}
.en-quiz .q-item .q-opt:hover{background:var(--orange-bg)}
.en-quiz .q-item .q-opt.correct{background:var(--ok);color:#fff;border-color:var(--ok)}
.en-quiz .q-item .q-opt.wrong{background:var(--orange-soft);border-color:var(--orange)}

/* Math quiz */
.math-quiz{margin-top:10px}
.math-quiz .mq-item{padding:8px;margin-bottom:6px;background:var(--card);border-radius:8px;border:1px solid var(--line)}
.math-quiz .mq-item .mq-text{font-size:14px;font-weight:600;margin-bottom:6px}
.math-quiz .mq-item .mq-opts{display:flex;flex-wrap:wrap;gap:6px}
.math-quiz .mq-item .mq-opt{
  padding:8px 14px;border-radius:8px;font-size:14px;cursor:pointer;
  background:var(--bg-soft);border:1px solid var(--line);transition:all .15s;
  min-width:60px;text-align:center;
}
.math-quiz .mq-item .mq-opt:hover{background:var(--orange-bg)}
.math-quiz .mq-item .mq-opt.correct{background:var(--ok);color:#fff;border-color:var(--ok)}
.math-quiz .mq-item .mq-opt.wrong{background:var(--orange-soft);border-color:var(--orange)}
.math-quiz .mq-score{font-size:14px;font-weight:700;color:var(--orange-deep);margin-top:8px;text-align:center}

/* Point display */
.point-display{
  background:var(--orange-bg);border-radius:10px;padding:14px;margin-bottom:10px;
  text-align:center;
}
.point-display .pt-val{font-size:28px;font-weight:700;color:var(--orange-deep)}
.point-display .pt-label{font-size:13px;color:var(--ink-soft)}
.point-display .pt-row{display:flex;justify-content:center;gap:16px;margin-top:8px}
.point-display .pt-item{text-align:center}
.point-display .pt-item span{font-size:18px;font-weight:700;color:var(--orange)}
.point-display .pt-item small{font-size:11px;color:var(--ink-soft)}

/* Drawer */
.drawer-overlay{
  position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.3);
  z-index:200;opacity:0;visibility:hidden;transition:all .3s;
}
.drawer-overlay.open{opacity:1;visibility:visible}
.drawer{
  position:fixed;top:0;left:-280px;width:280px;height:100%;background:var(--panel);
  z-index:201;transition:left .3s;overflow-y:auto;padding:16px;
}
.drawer.open{left:0}
.drawer .d-header{font-size:18px;font-weight:700;color:var(--ink);margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.drawer .d-close{width:28px;height:28px;border:none;background:none;cursor:pointer;font-size:20px;color:var(--ink)}
.drawer .d-section{margin-bottom:16px}
.drawer .d-section-title{font-size:13px;font-weight:700;color:var(--ink-soft);margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.drawer .d-task{display:flex;align-items:center;gap:8px;padding:8px 6px;border-radius:8px;cursor:pointer;font-size:14px;transition:all .15s}
.drawer .d-task:hover{background:var(--card)}
.drawer .d-task .d-icon{width:20px;height:20px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10px;color:#fff}
.drawer .d-task .d-name{flex:1}
.drawer .d-task .d-count{font-size:12px;color:var(--ink-soft)}

/* Add modal */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.3);z-index:300;opacity:0;visibility:hidden;transition:all .3s;display:flex;align-items:center;justify-content:center}
.modal-overlay.open{opacity:1;visibility:visible}
.modal{background:var(--card);border-radius:16px;padding:20px;width:90%;max-width:360px;max-height:80vh;overflow-y:auto}
.modal .m-title{font-size:18px;font-weight:700;margin-bottom:12px}
.modal .m-group{margin-bottom:12px}
.modal .m-label{font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:4px}
.modal .m-input{width:100%;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg-soft);font-size:14px;color:var(--ink)}
.modal .m-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.modal .m-btn{padding:8px 16px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;border:none}
.modal .m-btn.primary{background:var(--orange);color:#fff}
.modal .m-btn.secondary{background:var(--card-2);color:var(--ink)}

/* Scrollbar */
.main::-webkit-scrollbar{width:4px}
.main::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}

/* Responsive */
@media(min-width:768px){
  .english-dual{flex-wrap:nowrap}
  .chip{padding:10px 18px}
}
</style>
</head>
<body>
<div class="app">
  <!-- Top Bar -->
  <div class="topbar">
    <button class="hamburger" onclick="toggleDrawer()" aria-label="菜单">☰</button>
    <span class="title">Abby 学习工作台</span>
    <span class="date" id="dateDisplay"></span>
    <button class="add-btn" onclick="openAddModal()" aria-label="新增">+</button>
  </div>

  <!-- Chips -->
  <div class="chips-wrap" id="chipsWrap"></div>

  <!-- Main -->
  <div class="main" id="mainArea"></div>
</div>

<!-- Drawer Overlay -->
<div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="d-header">任务列表 <button class="d-close" onclick="toggleDrawer()">✕</button></div>
  <div id="drawerContent"></div>
</div>

<!-- Add Modal -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <div class="m-title">新增自定义任务</div>
    <div class="m-group">
      <div class="m-label">所属类别</div>
      <select class="m-input" id="addCategory">
        <option value="chinese">语文</option>
        <option value="math">数学</option>
        <option value="english">英语</option>
        <option value="game">游戏</option>
      </select>
    </div>
    <div class="m-group">
      <div class="m-label">任务名称</div>
      <input class="m-input" id="addName" placeholder="输入任务名称">
    </div>
    <div class="m-group">
      <div class="m-label">视频链接（可选）</div>
      <input class="m-input" id="addVideo" placeholder="https://...">
    </div>
    <div class="m-group">
      <div class="m-label">描述（可选）</div>
      <textarea class="m-input" id="addDesc" rows="3" placeholder="任务描述"></textarea>
    </div>
    <div class="m-btns">
      <button class="m-btn secondary" onclick="closeAddModal()">取消</button>
      <button class="m-btn primary" onclick="saveCustomTask()">保存</button>
    </div>
  </div>
</div>

/* ============ STORAGE ============ */
function loadState(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(!raw) return;
    var saved = JSON.parse(raw);
    // Migration: ensure all fields exist
    state.checked = saved.checked || {};
    state.points = saved.points || 0;
    state.exchangedMinutes = saved.exchangedMinutes || 0;
    state.playedMinutes = saved.playedMinutes || 0;
    state.lastDate = saved.lastDate || '';
    state.customTasks = saved.customTasks || [];
    state.expandedTasks = saved.expandedTasks || {};
    state.mathQuizAnswers = saved.mathQuizAnswers || {};
    state.enQuizAnswers = saved.enQuizAnswers || {};
    // Daily reset
    checkDailyReset();
  }catch(e){
    console.error('loadState error',e);
    state = {activeTab:'chinese',checked:{},points:0,exchangedMinutes:0,playedMinutes:0,lastDate:'',customTasks:[],expandedTasks:{},mathQuizAnswers:{},enQuizAnswers:{}};
  }
}

function saveState(){
  try{
    state.lastDate = getTodayStr();
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
  }catch(e){
    console.error('saveState error',e);
  }
}

function getTodayStr(){
  var d = new Date();
  return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
}

function checkDailyReset(){
  var today = getTodayStr();
  if(state.lastDate && state.lastDate !== today){
    // Cross-day: reset checked, points, exchanged, played
    state.checked = {};
    state.points = 0;
    state.exchangedMinutes = 0;
    state.playedMinutes = 0;
    state.mathQuizAnswers = {};
    state.enQuizAnswers = {};
    state.lastDate = today;
    saveState();
  }
  if(!state.lastDate) state.lastDate = today;
}

/* ============ POINTS ============ */
function calcPoints(){
  var pts = 0;
  var catKeys = ['chinese','math','english'];
  catKeys.forEach(function(cat){
    var children = TASKS[cat].children;
    var allDone = true;
    children.forEach(function(c){
      if(state.checked[c.id]){
        pts += 10;
      } else {
        allDone = false;
      }
    });
    if(allDone) pts += 50;
  });
  // custom tasks in chinese/math/english
  state.customTasks.forEach(function(ct){
    if(catKeys.indexOf(ct.category) >= 0 && state.checked[ct.id]){
      pts += 10;
    }
  });
  // deduct exchanged
  var deducted = state.exchangedMinutes * (50/15);
  return pts - Math.floor(deducted);
}

function getTotalAvailablePoints(){
  return calcPoints();
}

  });
  html += '<div class="math-quiz" data-taskid="'+child.id+'">';
  child.quiz.forEach(function(q,i){
    var answered = answers[i];
    var correctAns = ansKey(q);
    var isCorrect = answered === correctAns;
    var isWrong = answered !== undefined && !isCorrect;
    html += '<div class="mq-item">';
    html += '<div class="mq-text">'+(i+1)+'. '+q.q+'</div>';

    q.opts.forEach(function(opt,oi){

      if(isWrong && oi === answered) optCls = 'mq-opt wrong';
      var disabled = isCorrect ? 'style="pointer-events:none"' : '';

    });
    html += '</div></div>';
  });
  html += '<div class="mq-score">得分：'+score+'/'+child.quiz.length+'</div>';
  html += '</div>';
  html += '</div>';
  return html;
}

/* ============ ACTIONS ============ */
function switchTab(tab){
  state.activeTab = tab;
  saveState();
  render();
}

function toggleCheck(id){
  try{
    if(state.checked[id]){
      delete state.checked[id];
    } else {
      state.checked[id] = true;
      // Auto check math quiz if all correct
      checkMathQuizCompletion(id);
      checkEnQuizCompletion(id);
    }
    state.points = calcPoints();
    saveState();
    render();
  }catch(e){console.error('toggleCheck error',e)}
}

function checkMathQuizCompletion(id){
  // Find math child with this id
  var child = null;
  TASKS.math.children.forEach(function(c){ if(c.id === id) child = c; });
  if(!child || !child.quiz) return;
  var ansKey = function(q){ return q.a !== undefined ? q.a : q.ans; };
  var answers = state.mathQuizAnswers[id] || {};
  var allCorrect = true;
  child.quiz.forEach(function(q,i){
    if(answers[i] !== ansKey(q)) allCorrect = false;
  });
  if(allCorrect && !state.checked[id]){
    state.checked[id] = true;
  }
}

function checkEnQuizCompletion(id){
  var child = null;
  TASKS.english.children.forEach(function(c){ if(c.id === id) child = c; });
  if(!child || !child.quiz) return;
  var ansKey = function(q){ return q.a !== undefined ? q.a : q.ans; };
  var answers = state.enQuizAnswers[id] || {};
  var allCorrect = true;
  child.quiz.forEach(function(q,i){
    if(answers[i] !== ansKey(q)) allCorrect = false;
  });
  if(allCorrect && !state.checked[id]){
    state.checked[id] = true;
  }
}

function toggleExpand(id){
  state.expandedTasks[id] = !state.expandedTasks[id];
  saveState();
  render();
}

function answerMath(taskId, qIdx, optIdx){
  try{
    if(!state.mathQuizAnswers[taskId]) state.mathQuizAnswers[taskId] = {};
    var child = null;
    TASKS.math.children.forEach(function(c){ if(c.id === taskId) child = c; });
    if(!child) return;
    var ansKey = function(q){ return q.a !== undefined ? q.a : q.ans; };
    var q = child.quiz[qIdx];
    // If already correct, skip
    if(state.mathQuizAnswers[taskId][qIdx] === ansKey(q)) return;
    state.mathQuizAnswers[taskId][qIdx] = optIdx;
    // Check if all correct -> auto mark complete
    var allCorrect = true;
    child.quiz.forEach(function(qq,i){
      if(state.mathQuizAnswers[taskId][i] !== ansKey(qq)) allCorrect = false;
    });
    if(allCorrect){
      state.checked[taskId] = true;
    }
    saveState();
    render();
  }catch(e){console.error('answerMath error',e)}
}

function answerEn(taskId, qIdx, optIdx){
  try{
    if(!state.enQuizAnswers[taskId]) state.enQuizAnswers[taskId] = {};
    var child = null;
    TASKS.english.children.forEach(function(c){ if(c.id === taskId) child = c; });
    if(!child) return;
    var ansKey = function(q){ return q.a !== undefined ? q.a : q.ans; };
    var q = child.quiz[qIdx];
    if(state.enQuizAnswers[taskId][qIdx] === ansKey(q)) return;

    if(allCorrect){

  }catch(e){console.error('answerEn error',e)}

/* ============ ENGLISH PLAY & READ ============ */
function speakLine(text){
  try{
    if('speechSynthesis' in window){
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = 0.8;
      speechSynthesis.speak(u);
    }
  }catch(e){console.error('speakLine error',e)}
}

function findEnglishChild(epId){
  var eps = TASKS.english.children;
  for(var i=0;i<eps.length;i++){
    if(eps[i].id === epId){ return eps[i]; }
  }
  return null;
}

function playLine(epId, idx){
  var child = findEnglishChild(epId);
  if(!child || !child.script || !child.script[idx]) return;
  var line = child.script[idx];
  // Update left scene panel
  var scene = document.getElementById('sceneLine-'+epId);
  if(scene){
    scene.querySelector('.scene-role').textContent = line.role;
    scene.querySelector('.scene-en').textContent = line.en;
    scene.querySelector('.scene-zh').textContent = line.zh;
  }
  // Highlight current line
  var allLines = document.querySelectorAll('.read-col .line-item');
  allLines.forEach(function(l){ l.classList.remove('reading'); });
  var curLine = document.getElementById('line-'+epId+'-'+idx);
  if(curLine){ curLine.classList.add('reading'); }
  // Speak
  try{
    if('speechSynthesis' in window){
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(line.en);
      u.lang = 'en-US';
      u.rate = 0.8;
      speechSynthesis.speak(u);
    }
  }catch(e){console.error('playLine error',e)}
}

function normalizeText(s){
  return s.toLowerCase().replace(/[^a-z0-9\s]/g,'').replace(/\s+/g,' ').trim();
}

function levenshtein(a, b){
  if(a.length === 0) return b.length;
  if(b.length === 0) return a.length;
  var m = [];
  for(var i=0;i<=b.length;i++){ m[i] = [i]; }
  for(var j=0;j<=a.length;j++){ m[0][j] = j; }
  for(var i=1;i<=b.length;i++){
    for(var j=1;j<=a.length;j++){
      if(b.charAt(i-1) === a.charAt(j-1)){ m[i][j] = m[i-1][j-1]; }
      else{ m[i][j] = Math.min(m[i-1][j-1]+1, m[i][j-1]+1, m[i-1][j]+1); }
    }
  }
  return m[b.length][a.length];
}

function compareText(original, recognized){
  var a = normalizeText(original);
  var b = normalizeText(recognized);
  if(a.length === 0) return 0;
  var dist = levenshtein(a, b);
  var maxLen = Math.max(a.length, b.length);
  return Math.round((1 - dist/maxLen) * 100);
}

var _activeRec = null;
function startRead(epId, idx){
  var child = findEnglishChild(epId);
  if(!child || !child.script || !child.script[idx]) return;
  var line = child.script[idx];
  var micBtn = document.getElementById('mic-'+epId+'-'+idx);
  var result = document.getElementById('result-'+epId+'-'+idx);
  var sceneRead = document.getElementById('sceneRead-'+epId);
  if(!micBtn || !result) return;
  // Stop any active recognition
  if(_activeRec){
    try{ _activeRec.stop(); }catch(e){}
    _activeRec = null;
  }
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    result.textContent = '不支持语音识别，请用Chrome';
    result.className = 'read-result nosupport';
    return;
  }
  var rec = new SR();
  rec.lang = 'en-US';
  rec.interimResults = true;
  rec.continuous = false;
  _activeRec = rec;
  micBtn.classList.add('recording');
  micBtn.textContent = '●';
  result.textContent = '录音中…';
  result.className = 'read-result retry';
  if(sceneRead){ sceneRead.textContent = '🎧 正在听…'; }
  var finalText = '';
  rec.onresult = function(event){
    var interim = '';
    for(var i=event.resultIndex;i<event.results.length;i++){
      if(event.results[i].isFinal){ finalText += event.results[i][0].transcript; }
      else{ interim += event.results[i][0].transcript; }
    }
    if(sceneRead){
      sceneRead.textContent = '你说：' + (finalText || interim);
    }
    if(finalText){
      var score = compareText(line.en, finalText);
      if(score >= 80){
        result.textContent = '✓ 很棒！ ' + score + '%';
        result.className = 'read-result ok';
      }else{
        result.textContent = '↻ ' + score + '% 再试';
        result.className = 'read-result retry';
      }
    }
  };
  rec.onerror = function(e){
    if(e.error === 'not-allowed'){
      result.textContent = '请允许麦克风权限';
    }else{
      result.textContent = '识别出错';
    }
    result.className = 'read-result retry';
    if(sceneRead){ sceneRead.textContent = ''; }
  };
  rec.onend = function(){
    micBtn.classList.remove('recording');
    micBtn.textContent = '🎤';
    if(_activeRec === rec){ _activeRec = null; }
    if(result.textContent === '录音中…'){
      result.textContent = '未听到，再试';
      result.className = 'read-result retry';
    }
  };
  try{ rec.start(); }catch(e){
    micBtn.classList.remove('recording');
    micBtn.textContent = '🎤';
    result.textContent = '启动失败';
    result.className = 'read-result retry';
  }
}

/* ============ BIG MUZZY SCENE SVG ============ */
function getMuzzyScene(epId){
  // Scene configurations: characters + background color per episode
  var scenes = {
    'e1': {bg:'#DCE5D8', chars:['muzzy','king','queen'], label:'I am...'},
    'e2': {bg:'#E8D5C4', chars:['bob','sylvia','corvax'], label:'This is...'},
    'e3': {bg:'#D4C5DB', chars:['norman','king','sylvia'], label:'Can I have...?'},
    'e4': {bg:'#C4DBD4', chars:['corvax','muzzy','cat'], label:'Where is...?'},
    'e5': {bg:'#DBD4C4', chars:['king','queen','bob'], label:'Colors & Numbers'},
    'e6': {bg:'#C9D4DB', chars:['muzzy','sylvia','corvax'], label:'I can...'},
    'e7': {bg:'#D4DBC9', chars:['bob','king','queen'], label:'Time'},
    'e8': {bg:'#DBC4D4', chars:['norman','muzzy','cat'], label:'Food'},
    'e9': {bg:'#C4D4DB', chars:['sylvia','bob','corvax'], label:'Family'},
    'e10': {bg:'#DBE5D8', chars:['king','muzzy','queen'], label:'Weather'},
    'e11': {bg:'#E5DBC4', chars:['bob','sylvia','norman'], label:'Feelings'},
    'e12': {bg:'#D4DBE5', chars:['muzzy','king','corvax'], label:'Goodbye'}
  };
  var sc = scenes[epId] || scenes['e1'];
  var svg = '<svg viewBox="0 0 280 180" xmlns="http://www.w3.org/2000/svg">';
  svg += '<rect width="280" height="180" rx="8" fill="'+sc.bg+'"/>';
  // Draw characters
  var positions = [60, 140, 220];
  var names = {muzzy:'#6B8E5A',king:'#D4A574',queen:'#C49B7E',bob:'#7BA3C7',sylvia:'#E0A0B0',corvax:'#8B7DAE',norman:'#D4C974',cat:'#A0A0A0'};
  var xOffsets = [60, 140, 220];
  sc.chars.forEach(function(ch, i){
    var x = xOffsets[i] || 60;
    var color = names[ch] || '#999';
    svg += drawChar(ch, x, 130, color);
  });
  // Ground line
  svg += '<line x1="20" y1="155" x2="260" y2="155" stroke="#A8B89A" stroke-width="2"/>';
  // Label
  svg += '<text x="140" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="#6B7B5A" font-family="Arial">Big Muzzy</text>';
  svg += '<text x="140" y="42" text-anchor="middle" font-size="10" fill="#8A9A7A" font-family="Arial">'+sc.label+'</text>';
  svg += '</svg>';
  return svg;
}

function drawChar(type, x, y, color){
  var s = '';
  if(type === 'muzzy'){
    // Big round green alien
    s += '<circle cx="'+x+'" cy="'+(y-40)+'" r="28" fill="'+color+'"/>'; // head
    s += '<circle cx="'+(x-10)+'" cy="'+(y-42)+'" r="5" fill="#fff"/>'; // left eye
    s += '<circle cx="'+(x+10)+'" cy="'+(y-42)+'" r="5" fill="#fff"/>'; // right eye
    s += '<circle cx="'+(x-10)+'" cy="'+(y-42)+'" r="2.5" fill="#333"/>';
    s += '<circle cx="'+(x+10)+'" cy="'+(y-42)+'" r="2.5" fill="#333"/>';
    s += '<rect x="'+(x-20)+'" y="'+(y-12)+'" width="40" height="25" rx="8" fill="'+color+'"/>'; // body
    s += '<text x="'+x+'" y="'+(y+5)+'" text-anchor="middle" font-size="8" fill="#fff" font-weight="bold" font-family="Arial">MZ</text>';
  }else if(type === 'king'){
    // King with crown
    s += '<circle cx="'+x+'" cy="'+(y-40)+'" r="22" fill="'+color+'"/>';
    s += '<polygon points="'+(x-12)+','+(y-58)+' '+(x-6)+','+(y-68)+' '+(x)+','+(y-58)+' '+(x+6)+','+(y-68)+' '+(x+12)+','+(y-58)+'" fill="#F1C40F"/>'; // crown
    s += '<circle cx="'+(x-8)+'" cy="'+(y-42)+'" r="3" fill="#333"/>';
    s += '<circle cx="'+(x+8)+'" cy="'+(y-42)+'" r="3" fill="#333"/>';
    s += '<rect x="'+(x-16)+'" y="'+(y-15)+'" width="32" height="22" rx="6" fill="'+color+'"/>';
  }else if(type === 'queen'){
    // Queen
    s += '<circle cx="'+x+'" cy="'+(y-40)+'" r="20" fill="'+color+'"/>';
    s += '<polygon points="'+(x-10)+','+(y-56)+' '+(x)+','+(y-64)+' '+(x+10)+','+(y-56)+'" fill="#E74C3C"/>'; // tiara
    s += '<circle cx="'+x+'" cy="'+(y-60)+'" r="3" fill="#F1C40F"/>';
    s += '<circle cx="'+(x-7)+'" cy="'+(y-42)+'" r="3" fill="#333"/>';
    s += '<circle cx="'+(x+7)+'" cy="'+(y-42)+'" r="3" fill="#333"/>';
    s += '<path d="M '+(x-14)+' '+(y-25)+' Q '+x+' '+(y-18)+' '+(x+14)+' '+(y-25)+'" stroke="'+color+'" stroke-width="3" fill="none"/>'; // hair
    s += '<rect x="'+(x-14)+'" y="'+(y-15)+'" width="28" height="20" rx="6" fill="'+color+'"/>';
  }else if(type === 'bob'){
    // Gardener boy
    s += '<circle cx="'+x+'" cy="'+(y-38)+'" r="18" fill="'+color+'"/>';
    s += '<path d="M '+(x-18)+' '+(y-38)+' Q '+x+' '+(y-60)+' '+(x+18)+' '+(y-38)+'" fill="#5A8A5A"/>'; // hat
    s += '<circle cx="'+(x-6)+'" cy="'+(y-40)+'" r="2.5" fill="#333"/>';
    s += '<circle cx="'+(x+6)+'" cy="'+(y-40)+'" r="2.5" fill="#333"/>';
    s += '<rect x="'+(x-12)+'" y="'+(y-18)+'" width="24" height="20" rx="5" fill="'+color+'"/>';
  }else if(type === 'sylvia'){
    // Princess
    s += '<circle cx="'+x+'" cy="'+(y-38)+'" r="18" fill="'+color+'"/>';
    s += '<path d="M '+(x-15)+' '+(y-35)+' Q '+x+' '+(y-55)+' '+(x+15)+' '+(y-35)+'" fill="#D4A0A0"/>'; // hair
    s += '<circle cx="'+x+'" cy="'+(y-50)+'" r="3" fill="#F1C40F"/>'; // tiara jewel
    s += '<circle cx="'+(x-6)+'" cy="'+(y-40)+'" r="2.5" fill="#333"/>';
    s += '<circle cx="'+(x+6)+'" cy="'+(y-40)+'" r="2.5" fill="#333"/>';
    s += '<rect x="'+(x-12)+'" y="'+(y-18)+'" width="24" height="20" rx="5" fill="'+color+'"/>';
  }else if(type === 'corvax'){
    // Minister (tall, thin)
    s += '<circle cx="'+x+'" cy="'+(y-42)+'" r="16" fill="'+color+'"/>';
    s += '<polygon points="'+(x-10)+','+(y-52)+' '+(x)+','+(y-62)+' '+(x+10)+','+(y-52)+'" fill="#2C3E50"/>'; // hat
    s += '<circle cx="'+(x-5)+'" cy="'+(y-44)+'" r="2.5" fill="#E74C3C"/>'; // red eyes
    s += '<circle cx="'+(x+5)+'" cy="'+(y-44)+'" r="2.5" fill="#E74C3C"/>';
    s += '<rect x="'+(x-8)+'" y="'+(y-20)+'" width="16" height="28" rx="3" fill="'+color+'"/>';
  }else if(type === 'norman'){
    // Norman (small man)
    s += '<circle cx="'+x+'" cy="'+(y-30)+'" r="15" fill="'+color+'"/>';
    s += '<circle cx="'+(x-5)+'" cy="'+(y-32)+'" r="2.5" fill="#333"/>';
    s += '<circle cx="'+(x+5)+'" cy="'+(y-32)+'" r="2.5" fill="#333"/>';
    s += '<path d="M '+(x-6)+' '+(y-25)+' Q '+x+' '+(y-20)+' '+(x+6)+' '+(y-25)+'" stroke="#333" stroke-width="1.5" fill="none"/>'; // smile
    s += '<rect x="'+(x-10)+'" y="'+(y-16)+'" width="20" height="18" rx="4" fill="'+color+'"/>';
  }else if(type === 'cat'){
    // Cat
    s += '<circle cx="'+x+'" cy="'+(y-30)+'" r="14" fill="'+color+'"/>';
    s += '<polygon points="'+(x-10)+','+(y-42)+' '+(x-6)+','+(y-52)+' '+(x-2)+','+(y-42)+'" fill="'+color+'"/>'; // left ear
    s += '<polygon points="'+(x+2)+','+(y-42)+' '+(x+6)+','+(y-52)+' '+(x+10)+','+(y-42)+'" fill="'+color+'"/>'; // right ear
    s += '<circle cx="'+(x-5)+'" cy="'+(y-32)+'" r="2" fill="#F1C40F"/>';
    s += '<circle cx="'+(x+5)+'" cy="'+(y-32)+'" r="2" fill="#F1C40F"/>';
    s += '<rect x="'+(x-8)+'" y="'+(y-18)+'" width="16" height="15" rx="3" fill="'+color+'"/>';
  }
  return s;
}

/* ============ DRAWER ============ */
function toggleDrawer(){
  var overlay = document.getElementById('drawerOverlay');
  var drawer = document.getElementById('drawer');
  var isOpen = overlay.classList.contains('open');
  if(isOpen){
    overlay.classList.remove('open');
    drawer.classList.remove('open');
  } else {
    overlay.classList.add('open');
    drawer.classList.add('open');
  }
}

/* ============ ADD MODAL ============ */
function openAddModal(){
  document.getElementById('addModal').classList.add('open');
}

function closeAddModal(){
  document.getElementById('addModal').classList.add('open');
  document.getElementById('addModal').classList.remove('open');
}

function saveCustomTask(){
  try{
    var cat = document.getElementById('addCategory').value;
    var name = document.getElementById('addName').value.trim();
    if(!name){ alert('请输入任务名称'); return; }
    var video = document.getElementById('addVideo').value.trim();
    var desc = document.getElementById('addDesc').value.trim();
    var id = 'custom_' + Date.now();
    state.customTasks.push({
      id: id,
      category: cat,
      title: name,
      video: video,
      desc: desc
    });
    saveState();
    closeAddModal();
    document.getElementById('addName').value = '';
    document.getElementById('addVideo').value = '';
    document.getElementById('addDesc').value = '';
    render();
  }catch(e){console.error('saveCustomTask error',e)}
}

/* ============ INIT ============ */
function init(){
  loadState();
  render();

  // Register SW
  if('serviceWorker' in navigator){
    try{
      navigator.serviceWorker.register('./sw.js').then(function(reg){
        console.log('SW registered',reg);
      }).catch(function(err){
        console.error('SW register error',err);
      });
    }catch(e){console.error('SW error',e)}
  }
}
